<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>義工報名查詢</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css?v=20261113a">
</head>
<body class="bg-light">
  <div class="container py-4">
    <h1 class="text-2xl font-bold text-center mb-4">義工報名查詢系統</h1>
    <div id="loading" class="text-center text-muted">
      <div class="w-full h-1 bg-gray-200 rounded overflow-hidden mb-2"><div id="progressBar" class="h-full bg-blue-600 animate-progress"></div></div>
      載入資料中...
    </div>
    <div id="content" class="d-none">
      <div class="card mb-4" id="filterCard">
        <div class="card-body">
          <div class="row g-3 align-items-end">
            <div class="col-md-3">
              <label class="form-label">活動</label>
              <select id="activitySelect" class="form-select"></select>
            </div>
            <div class="col-md-3">
              <label class="form-label">大組</label>
              <select id="groupSelect" class="form-select"><option value="">請選擇大組</option></select>
            </div>
            <div class="col-md-3">
              <label class="form-label">小組</label>
              <select id="subgroupSelect" class="form-select" disabled><option value="">請選擇小組</option></select>
            </div>
            <div class="col-md-3">
              <label class="form-label">密碼</label>
              <input type="password" id="passwordInput" class="form-control" placeholder="請輸入密碼">
            </div>
          </div>
          <div class="row g-3 align-items-end mt-2">
            <div class="col-md-2">
              <label class="form-label">身分別</label>
              <select id="roleSelect" class="form-select"><option value="">全部</option></select>
            </div>
            <div class="col-md-2">
              <label class="form-label">性別</label>
              <select id="genderSelect" class="form-select"><option value="">全部</option><option value="男">男</option><option value="女">女</option></select>
            </div>
            <div class="col-md-3">
              <label class="form-label">搜尋</label>
              <input type="text" id="searchInput" class="form-control" placeholder="姓名或電話">
            </div>
            <div class="col-md-2">
              <button id="submitBtn" class="btn btn-primary w-100" disabled>查詢</button>
            </div>
            <div class="col-md-3 text-end">
              <a href="admin.html" class="btn btn-outline-secondary">管理後台</a>
            </div>
          </div>
          <p id="error" class="text-danger mt-2 d-none"></p>
          <p id="success" class="text-muted mt-2 d-none"></p>
        </div>
      </div>

      <div id="stats" class="card d-none">
        <div class="card-body">
          <h5 class="mb-2">統計摘要</h5>
          <div class="row text-center" id="statsCards"></div>
        </div>
      </div>

      <div id="results" class="card d-none">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <span id="resultCount" class="text-muted"></span>
            <div>
              <button id="btnExportCsv" class="btn btn-secondary btn-sm">匯出 CSV</button>
              <button id="btnPrintRoster" class="btn btn-secondary btn-sm">列印名冊</button>
            </div>
          </div>
          <div class="overflow-auto custom-scrollbar max-h-[65vh] relative rounded-xl border border-gray-200 bg-white shadow-sm">
            <table id="dataTable" class="w-full text-sm text-left border-collapse min-w-max">
              <thead class="text-xs text-gray-700 uppercase bg-gray-50 sticky top-0 z-20 shadow-[0_1px_2px_rgba(0,0,0,0.1)]"></thead>
              <tbody class="divide-y divide-gray-100"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js?v=20261113a"></script>
  <script src="js/app.js?v=20261113a"></script>
</body>
</html>
