<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>義工報名查詢</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
  <div class="container py-4">
    <h1 class="text-center mb-4">義工報名查詢系統</h1>
    <div id="loading" class="text-center text-muted">載入資料中...</div>
    <div id="content" class="d-none">
      <div class="card mb-4">
        <div class="card-body">
          <div class="row g-3 align-items-end">
            <div class="col-md-3">
              <label class="form-label">活動</label>
              <select id="activitySelect" class="form-select"></select>
            </div>
            <div class="col-md-3">
              <label class="form-label">大組</label>
              <select id="groupSelect" class="form-select"><option value="">請選擇大組</option></select>
            </div>
            <div class="col-md-3">
              <label class="form-label">小組</label>
              <select id="subgroupSelect" class="form-select" disabled><option value="">請選擇小組</option></select>
            </div>
            <div class="col-md-3">
              <label class="form-label">密碼</label>
              <input type="password" id="passwordInput" class="form-control" placeholder="請輸入密碼">
            </div>
          </div>
          <div class="row g-3 align-items-end mt-2">
            <div class="col-md-2">
              <label class="form-label">身分別</label>
              <select id="roleSelect" class="form-select"><option value="">全部</option></select>
            </div>
            <div class="col-md-2">
              <label class="form-label">性別</label>
              <select id="genderSelect" class="form-select"><option value="">全部</option><option value="男">男</option><option value="女">女</option></select>
            </div>
            <div class="col-md-3">
              <label class="form-label">搜尋</label>
              <input type="text" id="searchInput" class="form-control" placeholder="姓名或電話">
            </div>
            <div class="col-md-2">
              <button id="submitBtn" class="btn btn-primary w-100" disabled>查詢</button>
            </div>
            <div class="col-md-3 text-end">
              <a href="report.html" class="btn btn-outline-info">統計報表</a>
              <a href="admin.html" class="btn btn-outline-secondary">管理後台</a>
            </div>
          </div>
          <p id="error" class="text-danger mt-2 d-none"></p>
          <p id="success" class="text-muted mt-2 d-none"></p>
        </div>
      </div>

      <div id="results" class="card d-none">
        <div class="card-body">
          <div class="table-container">
            <table id="dataTable" class="table table-bordered table-striped table-sm">
              <thead></thead><tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
