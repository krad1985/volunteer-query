<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理後台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20261113d">
</head>
<body class="bg-light">
  <div class="container py-4">
    <h1 class="text-center mb-4">管理後台</h1>

    <div id="loginSection" class="card mb-4">
      <div class="card-body">
        <div class="row g-3 align-items-end">
          <div class="col-md-3">
            <label class="form-label">登入身分</label>
            <select id="loginRole" class="form-select">
              <option value="admin">總管理員</option>
              <option value="unit">單位管理員</option>
            </select>
          </div>
          <div class="col-md-3 d-none" id="loginUnitWrap">
            <label class="form-label">單位</label>
            <select id="loginUnit" class="form-select"></select>
          </div>
          <div class="col-md-3">
            <label class="form-label">密碼</label>
            <input type="password" id="adminPwd" class="form-control" placeholder="請輸入密碼">
          </div>
          <div class="col-md-2">
            <button id="btnLogin" class="btn btn-primary w-100">登入</button>
          </div>
        </div>
        <p id="loginHint" class="mt-2"></p>
      </div>
    </div>

    <div id="adminPanel" class="d-none">
      <div class="card mb-4" id="unitCard">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="mb-0">單位管理</h5>
            <button id="btnAddUnit" class="btn btn-sm btn-primary">＋ 新增單位</button>
          </div>
          <div id="unitForm" class="border rounded p-3 mb-3 d-none">
            <div class="row g-2 align-items-end">
              <div class="col-md-4">
                <label class="form-label">單位名稱</label>
                <input type="text" id="unitName" class="form-control" placeholder="例如：台北分會">
              </div>
              <div class="col-md-4">
                <label class="form-label">單位管理密碼（至少 6 碼）</label>
                <input type="text" id="unitPwd" class="form-control">
              </div>
              <div class="col-md-2"><button id="btnCreateUnit" class="btn btn-success w-100">建立</button></div>
              <div class="col-md-2"><button id="btnCancelUnit" class="btn btn-outline-secondary w-100">取消</button></div>
            </div>
            <p id="unitHint" class="mt-2 mb-0"></p>
          </div>
          <div id="unitList"></div>
        </div>
      </div>

      <div class="d-flex justify-content-between mb-3">
        <h3>活動列表</h3>
        <button id="btnAddActivity" class="btn btn-primary">＋ 新增活動</button>
      </div>
      <ul id="activityList" class="list-group mb-4"></ul>

      <div class="card mb-4">
        <div class="card-body">
          <h5 class="mb-3">統計報表</h5>
          <div class="row g-2 align-items-end mb-3">
            <div class="col-md-4">
              <label class="form-label">活動</label>
              <select id="reportActivitySelect" class="form-select"></select>
            </div>
            <div class="col-md-2">
              <div class="form-check"><input class="form-check-input" type="checkbox" id="reportChkRole"><label class="form-check-label" for="reportChkRole">區分身分</label></div>
            </div>
            <div class="col-md-2">
              <div class="form-check"><input class="form-check-input" type="checkbox" id="reportChkGender"><label class="form-check-label" for="reportChkGender">區分性別</label></div>
            </div>
            <div class="col-md-2">
              <div class="form-check"><input class="form-check-input" type="checkbox" id="reportChkRowSub"><label class="form-check-label" for="reportChkRowSub">顯示大組小計</label></div>
            </div>
            <div class="col-md-2"><button id="reportLoadBtn" class="btn btn-primary">載入報表</button></div>
            <div class="col-md-2"><button id="reportImgBtn" class="btn btn-outline-secondary">下載表格圖片</button></div>
          </div>
          <ul class="nav nav-tabs" id="reportTabs">
            <li class="nav-item"><button class="nav-link active" data-tab="manpower">整體人力</button></li>
            <li class="nav-item"><button class="nav-link" data-tab="meals">用餐狀況</button></li>
            <li class="nav-item"><button class="nav-link" data-tab="lodging">住宿狀況</button></li>
          </ul>
          <div id="reportContainer" class="mt-3"></div>
        </div>
      </div>

      <dialog id="activityModal" class="modal-dialog" style="max-width:900px;">
        <div class="modal-content p-3">
          <h4 id="modalTitle">新增活動</h4>
          <input type="hidden" id="editActivityId">
          <div class="mb-2">
            <label class="form-label">活動名稱</label>
            <input type="text" id="actName" class="form-control">
          </div>
          <div class="mb-2" id="actUnitWrap">
            <label class="form-label">所屬單位</label>
            <select id="actUnit" class="form-select"></select>
            <div class="form-text">選「不分單位」表示由總管理員管理</div>
          </div>
          <div class="mb-2">
            <label class="form-label">試算表網址</label>
            <input type="text" id="actSheetUrl" class="form-control">
          </div>
          <div class="mb-2">
            <label class="form-label">工作表名稱（選填）</label>
            <input type="text" id="actSheetName" class="form-control">
          </div>
          <button id="btnTestConnection" class="btn btn-secondary mb-2">測試連線並取得欄位</button>
          <p id="connectionHint" class="small"></p>

          <div id="fieldMapping" class="d-none">
            <h5>欄位對應</h5>
            <div class="row g-2">
              <div class="col-md-4"><label>大組欄位</label><select id="mapGroup" class="form-select"></select></div>
              <div class="col-md-4"><label>小組欄位</label><select id="mapSubgroup" class="form-select"></select></div>
              <div class="col-md-4"><label>身分別欄位</label><select id="mapRole" class="form-select"></select></div>
              <div class="col-md-4"><label>性別欄位</label><select id="mapGender" class="form-select"></select></div>
              <div class="col-md-4"><label>姓名欄位</label><select id="mapName" class="form-select"></select></div>
              <div class="col-md-4"><label>電話欄位</label><select id="mapPhone" class="form-select"></select></div>
            </div>

            <h5 class="mt-3">日期 / 餐宿欄位對應（JSON）</h5>
            <p class="small text-muted">格式：[{"label":"8/7","attendanceField":"義工進駐...","breakfastField":"8/07早餐","lunchField":"8/07午餐","dinnerField":"8/07晚餐","lodgingField":"住宿調查..."}]</p>
            <textarea id="dayMappingsJson" class="form-control" rows="6"></textarea>
            <button id="btnAutoDetect" class="btn btn-outline-secondary btn-sm mt-1">自動偵測</button>

            <h5 class="mt-3">顯示欄位（勾選）</h5>
            <div id="displayFieldsBox" class="border p-2" style="max-height:200px;overflow:auto;"></div>

            <div class="mb-2 mt-2">
              <label>存取金鑰（選填）</label>
              <input type="text" id="actAccessKey" class="form-control">
            </div>
          </div>

          <div class="mt-3">
            <button type="button" id="btnSaveActivity" class="btn btn-primary">儲存</button>
            <button id="btnCloseModal" class="btn btn-secondary">關閉</button>
          </div>
        </div>
      </dialog>
    </div>
  </div>

  <script src="js/config.js?v=20261113d"></script>
  <script src="js/admin.js?v=20261113d"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</body>
</html>
